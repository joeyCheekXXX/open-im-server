# 单人禁言。产品没有单人禁言，保持通道默认即可。
groupMemberMuted:
  isSendMsg: false
  reliabilityLevel: 1
  unreadCount: false
  offlinePush:
    enable: false
    title: groupMemberMuted title
    desc: groupMemberMuted desc
    ext: groupMemberMuted ext

# 取消单人禁言。产品没有单人禁言，保持通道默认即可。
groupMemberCancelMuted:
  isSendMsg: false
  reliabilityLevel: 1
  unreadCount: false
  offlinePush:
