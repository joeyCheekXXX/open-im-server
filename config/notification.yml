# 通道系统通知。每项控制一类关系/群事件要不要往会话落系统消息、计未读、离线推。
# 关系事件（onFriendAdded、onGroupMemberAdded 等）不受 isSendMsg 影响，照常推。
#
# 共用字段：
#   isSendMsg         是否往会话落一条系统消息并可能改 latestMsg。false=静默同步。
#   reliabilityLevel  投递可靠性。官方已废弃，固定 1（仅在线）。2 曾表示必达。
#   unreadCount       是否计入未读。仅 isSendMsg=true 时生效。
#   offlinePush       系统级离线推送。第一期三端不接 FCM/APNs/Web Push，enable 保持 false。
#     enable          是否发这条离线推送。
#     title           离线推送标题。enable=false 时不发出。
#     desc            离线推送摘要。
#     ext             离线推送扩展字段。
#   defaultTips.tips  落会话时的默认文案。多数项没有；有则填在该项下。

#############################group##################################

# 建群。群会话落一条建群系统消息。
groupCreated:
  isSendMsg: false
  reliabilityLevel: 1
  unreadCount: false
  offlinePush:
    enable: false
    title: create group title
    desc: create group desc
    ext: create group ext

# 改群资料（综合项：名/头像/简介等）。产品改群走业务接口，不靠这条出气泡。
groupInfoSet:
  isSendMsg: false
  reliabilityLevel: 1
  unreadCount: false
  offlinePush:
    enable: false
    title: groupInfoSet title
    desc: groupInfoSet desc
    ext: groupInfoSet ext

# 入群申请已提交。申请不进会话，只走入群申请列表。
joinGroupApplication:
  isSendMsg: false
  reliabilityLevel: 1
  unreadCount: false
  offlinePush:
    enable: true
    title: joinGroupApplication title
    desc: joinGroupApplication desc
    ext: joinGroupApplication ext

# 成员退群。群会话落一条退群系统消息。
memberQuit:
  isSendMsg: false
  reliabilityLevel: 1
  unreadCount: false
  offlinePush:
    enable: false
    title: memberQuit title
    desc: memberQuit desc
    ext: memberQuit ext

# 入群申请被接受。进群提示走 memberEnter，不另落一条「申请通过」。
groupApplicationAccepted:
  isSendMsg: false
  reliabilityLevel: 1
  unreadCount: false
  offlinePush:
    enable: true
    title: groupApplicationAccepted title
    desc: groupApplicationAccepted desc
    ext: groupApplicationAccepted ext

# 入群申请被拒绝。拒绝不进会话。
groupApplicationRejected:
  isSendMsg: false
  reliabilityLevel: 1
  unreadCount: false
  offlinePush:
