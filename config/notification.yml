    desc: groupInfoSetName desc
    ext: groupInfoSetName ext

#############################friend#################################

# 好友申请已发出。申请不进会话，只走好友申请列表。
friendApplicationAdded:
  isSendMsg: false
  reliabilityLevel: 1
  unreadCount: false
  offlinePush:
    enable: true
    title: Somebody applies to add you as a friend
    desc: Somebody applies to add you as a friend
    ext: Somebody applies to add you as a friend

# 必须 false。import_friend（恢复好友）与同意申请都走这条 1201。
# 恢复没有申请记录，defaultTips 为空；若 isSendMsg=true，空通知会写成
# 会话最近消息，对端重启后预览被占住。成为好友气泡由业务 worker 写，不靠通道。
friendApplicationApproved:
  isSendMsg: false
  reliabilityLevel: 1
  unreadCount: false
  offlinePush:
    enable: true
    title: Someone applies to add your friend application
    desc: Someone applies to add your friend application
    ext: Someone applies to add your friend application

# 拒绝好友申请。拒绝不进会话。
friendApplicationRejected:
  isSendMsg: false
  reliabilityLevel: 1
  unreadCount: false
  offlinePush:
    enable: true
    title: Someone rejected your friend application
    desc: Someone rejected your friend application
    ext: Someone rejected your friend application

# 必须 false。成为好友气泡由业务 after 回调入队写入，不靠通道 1204。
friendAdded:
  isSendMsg: false
  reliabilityLevel: 1
  unreadCount: false
  offlinePush:
    enable: false
    title: We have become friends
    desc: We have become friends
    ext: We have become friends

# 删除好友。删除只解自己这边；提示只在本机出现，不写入消息历史。
friendDeleted:
  isSendMsg: false
  reliabilityLevel: 1
  unreadCount: false
  offlinePush:
    enable: false
    title: deleted a friend
    desc: deleted a friend
    ext: deleted a friend

# 改好友备注。备注只对自己可见，不进会话。
friendRemarkSet:
  isSendMsg: false
  reliabilityLevel: 1
  unreadCount: false
  offlinePush:
    enable: false
    title: Your friend's profile has been changed
    desc: Your friend's profile has been changed
    ext: Your friend's profile has been changed

# 拉黑。拉黑不解除好友；拒收提示只在本机，不写入消息历史。
blackAdded:
  isSendMsg: false
  reliabilityLevel: 1
  unreadCount: false
  offlinePush:
    enable: false
    title: blocked a user
    desc: blocked a user
    ext: blocked a user

# 取消拉黑。立刻回到好友表，不必再申请；不进会话。
blackDeleted:
  isSendMsg: false
  reliabilityLevel: 1
  unreadCount: false
  offlinePush:
    enable: false
    title: Remove a blocked user
    desc: Remove a blocked user
    ext: Remove a blocked user

# 好友资料变更（通道侧同步）。不往会话落消息。
friendInfoUpdated:
  isSendMsg: false
  reliabilityLevel: 1
  unreadCount: false
